[project]
name = "noodlelab-engineering"
# its own version: plugins are versioned as a whole (see docs/plugins/writing.md)
version = "1.0.0"
description = "Engineering: structures, sections, materials, fluids, heat, decibels, trade studies and control systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nicolas Kalis" }]
dependencies = [
    "noodlelab>=0.2.2.dev0,<1",
    "noodlelab-maths>=1,<2",
    "noodlelab-symbolic>=1,<2",
    "numpy>=1.26",
    "pandas>=3.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "control>=0.10.1,<0.11"  # python-control changes its API between minor versions,
]

[project.urls]
Homepage = "https://nkalis.github.io/noodlelab/"

# how noodlelab finds it; the name is the prefix of its node ids (engineering.<node>)
[project.entry-points."noodlelab.nodes"]
engineering = "noodlelab_engineering"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noodlelab_engineering"]
